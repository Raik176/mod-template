name: Bug report
description: Something in Example Mod doesn't work the way it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more of the fields below you fill in, the faster it can be fixed.
        Crashes: please attach the crash report (`crash-reports/`) or the `latest.log`.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      options:
        - label: I searched the existing issues and this isn't reported yet
          required: true
        - label: I'm using the latest Example Mod for my Minecraft version
          required: true
        - label: It still happens with only Example Mod and the mods it needs installed
  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - 1.21.1
        - Other (say which in the description)
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - Fabric
        - Forge
        - NeoForge
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: Example Mod version
      description: The version in the jar's file name, for example 1.0.0.
    validations:
      required: true
  - type: input
    id: loader_version
    attributes:
      label: Loader version
      description: Fabric Loader, Forge or NeoForge version. Optional, but it helps with loader-specific bugs.
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Multiplayer, on the client
        - Multiplayer, on a dedicated server
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      placeholder: |
        1. Start a new world
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and crash report
      description: |
        Paste a link to the `latest.log` or crash report uploaded to https://mclo.gs, or drag the file in here.
        Please don't paste the whole log as text.
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Other mods and their versions, if you use any. A modpack link is fine too.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, videos, a world download, resource packs or data packs in use.
