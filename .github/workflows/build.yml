name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck --stacktrace

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Check generated data
        run: |
          # the data generators must write what is committed; fix it with ./gradlew runDatagen and commit the result
          ./gradlew runDatagen --stacktrace
          if [ -n "$(git status --porcelain -- src)" ]; then
            echo "::error::The generated data in src is out of date. Run ./gradlew runDatagen and commit the changes."
            git status --porcelain -- src
            git --no-pager diff --stat -- src
            exit 1
          fi

      - name: Keep the jars
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jars
          if-no-files-found: ignore
          path: |
            versions/*/*/build/libs/*.jar
            !versions/*/*/build/libs/*-sources.jar
            !versions/*/*/build/libs/*-dev.jar
