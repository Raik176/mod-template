name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and generate the changelog, but create/upload nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Publish
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then publish=false; else publish=true; fi
          ./gradlew publishMods -Ppublish="$publish" --stacktrace

      - name: Commit update.json
        if: ${{ !inputs.dry_run }}
        env:
          UPDATE_JSON: update.json
        run: |
          # publishMods added this release to update.json, which Forge and NeoForge read from the repository
          if [ -n "$(git status --porcelain -- "$UPDATE_JSON")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$UPDATE_JSON"
            git commit -m "chore: update $UPDATE_JSON"
            git push
          fi

      - name: Keep dry-run output
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            **/build/changelog/changelog.md
            update.json
            **/build/publishMods/**
